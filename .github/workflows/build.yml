name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: app
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild \
            -project Scan3D.xcodeproj \
            -scheme Scan3D \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Scan3D.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R app/build/Build/Products/Release-iphoneos/Scan3D.app Payload/
          zip -qry Scan3D.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Scan3D-ipa
          path: Scan3D.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: app/build.log
